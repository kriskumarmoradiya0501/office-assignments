<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <style>
    /* =========================================
       1. CSS VARIABLES (Theme Colors)
       Industry Standard: Use variables so you 
       can easily change colors in one place.
       ========================================= */
    :root {
      --primary-color: #3b5bfd;
      --primary-hover: #2f4be0;
      --secondary-color: #7c5cff;
      --success-color: #16a34a;
      --accent-color: #7c3aed;
      --bg-color: #eceef4;
      --text-dark: #1f2430;
      --text-light: #6b7280;
      --text-placeholder: #9aa0ac;
      --border-color: #d7dae3;
      --white: #ffffff;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* =========================================
       2. RESET & BASE STYLES
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-color);
      color: var(--text-dark);
    }

    /* =========================================
       3. HEADER STYLES
       ========================================= */
    .page-header {
      background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      padding: 28px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .page-header .icon-circle {
      width: 56px;
      height: 56px;
      border: 2px solid var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .page-header .icon-circle svg { width: 28px; height: 28px; fill: var(--white); }
    .page-header h1 { color: var(--white); font-size: 28px; font-weight: 700; }
    .page-header p { color: #e6e8ff; font-size: 14px; margin-top: 2px; }

    /* =========================================
       4. MAIN CONTAINER & LAYOUT
       ========================================= */
    .form-container {
      max-width: 1050px;
      margin: 30px auto;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      padding: 32px 36px 28px;
    }

    /* CSS Grid for form layouts */
    .grid-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    .grid-row.two-col { grid-template-columns: repeat(2, 1fr); }
    .grid-row.three-col-notes { grid-template-columns: 1.6fr 1.6fr 1fr; }

    /* =========================================
       5. SECTION HEADERS & DIVIDERS
       ========================================= */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-header h2 { font-size: 17px; font-weight: 700; }
    
    .badge {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge svg { width: 16px; height: 16px; fill: var(--white); }

    /* Theme colors for sections */
    .theme-blue .badge { background: var(--primary-color); }
    .theme-blue h2 { color: var(--primary-color); }
    
    .theme-green .badge { background: var(--success-color); }
    .theme-green h2 { color: var(--success-color); }
    
    .theme-purple .badge { background: var(--accent-color); }
    .theme-purple h2 { color: var(--accent-color); }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border-color);
      margin-bottom: 22px;
    }
    hr.divider.theme-green { border-top-color: #bbf0cc; }
    hr.divider.theme-purple { border-top-color: #ddd0fb; }

    /* =========================================
       6. FORM ELEMENTS (Inputs, Labels, Selects)
       ========================================= */
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2b2f3a;
      margin-bottom: 6px;
    }

    .form-group label .required-asterisk { color: #e11d48; margin-left: 2px; }

    /* Target all text-like inputs */
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      font-size: 13.5px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #333;
      background: var(--white);
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder, textarea::placeholder { color: var(--text-placeholder); }
    
    input:focus, select:focus, textarea:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(59,91,253,0.12);
    }

    /* Radio Buttons */
    .radio-group {
      display: flex;
      align-items: center;
      gap: 22px;
      height: 37px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 400;
      cursor: pointer;
    }
    .radio-group input[type="radio"] { width: 15px; height: 15px; accent-color: var(--primary-color); }

    /* Custom File Input */
    .file-input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      font-size: 13px;
    }
    .file-input-wrap .choose-btn {
      background: #e9ebf0;
      padding: 8px 14px;
      border-right: 1px solid var(--border-color);
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .file-input-wrap .file-name { padding: 8px 12px; color: var(--text-placeholder); flex: 1; }
    .file-input-wrap input[type="file"] { display: none; }

    /* Textarea & Multi-select */
    textarea { resize: vertical; min-height: 100px; }
    .char-count {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-placeholder);
      margin-top: 4px;
    }
    select[multiple] { height: 110px; padding: 6px 0; }
    select[multiple] option { padding: 4px 12px; }

    /* =========================================
       7. BUTTONS & FOOTER
       ========================================= */
    .agree-box {
      background: #f3f6ff;
      border: 1px solid #dbe2fb;
      border-radius: 8px;
      padding: 18px 22px;
      margin-top: 6px;
    }
    .agree-box .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      margin-bottom: 16px;
    }
    .agree-box .checkbox-row input { width: 15px; height: 15px; }
    .agree-box .checkbox-row a { color: var(--primary-color); text-decoration: none; }
    .agree-box .checkbox-row a:hover { text-decoration: underline; }

    .btn-row { display: flex; justify-content: center; gap: 14px; }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn svg { width: 14px; height: 14px; fill: var(--white); }
    .btn.submit { background: var(--primary-color); color: var(--white); }
    .btn.submit:hover { background: var(--primary-hover); }
    .btn.reset { background: var(--text-light); color: var(--white); }
    .btn.reset:hover { background: #59616e; }

    .page-footer { text-align: center; padding: 18px; font-size: 12.5px; color: var(--text-light); }

    /* =========================================
       8. RESPONSIVE DESIGN (Media Queries)
       ========================================= */
    @media (max-width: 900px) {
      .grid-row { grid-template-columns: repeat(2, 1fr); }
      .grid-row.three-col-notes { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .grid-row, .grid-row.two-col { grid-template-columns: 1fr; }
      .form-container { padding: 24px 18px; }
    }
  </style>
</head>
<body>

  <!-- Semantic Header -->
  <header class="page-header">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
    </div>
    <div>
      <h1>User Registration Form</h1>
      <p>Clean, Accessible, and Responsive HTML5 Form</p>
    </div>
  </header>

  <!-- Semantic Main Wrapper -->
  <main>
    <form class="form-container" id="registrationForm" action="#" method="POST">

      <!-- SECTION 1: Personal Information -->
      <section>
        <div class="section-header theme-blue">
          <div class="badge">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
          </div>
          <h2>Personal Information</h2>
        </div>
        <hr class="divider">

        <div class="grid-row">
          <div class="form-group">
            <!-- 'for' attribute must match the input's 'id' -->
            <label for="fullName">Full Name <span class="required-asterisk">*</span></label>
            <!-- 'name' attribute is required to send data to the backend -->
            <input type="text" id="fullName" name="fullName" placeholder="Enter full name" required>
          </div>
          <div class="form-group">
            <label for="emailAddress">Email Address <span class="required-asterisk">*</span></label>
            <input type="email" id="emailAddress" name="emailAddress" placeholder="Enter email address" required>
          </div>
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter phone number">
          </div>
          <div class="form-group">
            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth">
          </div>
        </div>

        <div class="grid-row">
          <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="male"> Male</label>
              <label><input type="radio" name="gender" value="female"> Female</label>
              <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
          </div>
          <div class="form-group">
            <label for="userPassword">Password <span class="required-asterisk">*</span></label>
            <input type="password" id="userPassword" name="userPassword" placeholder="Enter password" required>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password <span class="required-asterisk">*</span></label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
          </div>
          <div class="form-group">
            <label>Profile Picture</label>
            <div class="file-input-wrap">
              <label class="choose-btn" for="profilePic">Choose File</label>
              <span class="file-name" id="fileNameLabel">No file chosen</span>
              <input type="file" id="profilePic" name="profilePic" accept="image/*">
            </div>
          </div>
        </div>
      </section>

      <!-- SECTION 2: Address Information -->
      <section>
        <div class="section-header theme-green">
          <div class="badge">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          </div>
          <h2>Address Information</h2>
        </div>
        <hr class="divider theme-green">

        <div class="grid-row">
          <div class="form-group">
            <label for="addressLine1">Address Line 1</label>
            <input type="text" id="addressLine1" name="addressLine1" placeholder="House no., Street name">
          </div>
          <div class="form-group">
            <label for="addressLine2">Address Line 2</label>
            <input type="text" id="addressLine2" name="addressLine2" placeholder="Apartment, suite, unit etc. (optional)">
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter city">
          </div>
          <div class="form-group">
            <label for="state">State</label>
            <select id="state" name="state">
              <option value="">Select State</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Delhi">Delhi</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Rajasthan">Rajasthan</option>
            </select>
          </div>
        </div>

        <div class="grid-row two-col">
          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="">Select Country</option>
              <option value="India">India</option>
              <option value="US">United States</option>
              <option value="UK">United Kingdom</option>
              <option value="Canada">Canada</option>
              <option value="Australia">Australia</option>
            </select>
          </div>
          <div class="form-group">
            <label for="zipCode">Pin / Zip Code</label>
            <input type="text" id="zipCode" name="zipCode" placeholder="Enter pin or zip code">
          </div>
        </div>
      </section>

      <!-- SECTION 3: Additional Information -->
      <section>
        <div class="section-header theme-purple">
          <div class="badge">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 5h6v2H9V5zm10 14H5V8h14v11z"/></svg>
          </div>
          <h2>Additional Information</h2>
        </div>
        <hr class="divider theme-purple">

        <div class="grid-row three-col-notes">
          <div class="form-group">
            <label for="aboutUser">About You</label>
            <textarea id="aboutUser" name="aboutUser" maxlength="200" placeholder="Write something about yourself..."></textarea>
            <div class="char-count">
              <span>Maximum 200 characters</span>
              <span><span id="charCount">0</span>/200</span>
            </div>
          </div>
          <div class="form-group">
            <label for="userSkills">Skills</label>
            <select id="userSkills" name="userSkills" multiple>
              <option value="html">HTML</option>
              <option value="css">CSS</option>
              <option value="js">JavaScript</option>
              <option value="java">Java</option>
              <option value="python">Python</option>
              <option value="react">React</option>
              <option value="node">Node.js</option>
            </select>
          </div>
          <div class="form-group">
            <label for="experienceLevel">Experience Level</label>
            <select id="experienceLevel" name="experienceLevel" style="margin-bottom: 20px;">
              <option value="">Select Experience Level</option>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
              <option value="expert">Expert</option>
            </select>
            
            <label for="contactTime">Preferred Contact Time</label>
            <select id="contactTime" name="contactTime">
              <option value="">Select Time</option>
              <option value="morning">Morning</option>
              <option value="afternoon">Afternoon</option>
              <option value="evening">Evening</option>
            </select>
          </div>
        </div>

        <!-- Submit & Terms Section -->
        <div class="agree-box">
          <div class="checkbox-row">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
            <label for="agreeTerms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</label>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn submit">
              <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
              Submit Form
            </button>
            <button type="reset" class="btn reset">
              <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              Reset Form
            </button>
          </div>
        </div>

      </section>
    </form>
  </main>

  <!-- Semantic Footer -->
  <footer class="page-footer">
    <p>© 2024 My Website. All rights reserved.</p>
  </footer>

  <!-- =========================================
       JAVASCRIPT LOGIC
       ========================================= -->
  <script>
    // Feature 1: Update the file input label when a user selects a file
    const fileInput = document.getElementById('profilePic');
    const fileNameLabel = document.getElementById('fileNameLabel');

    fileInput.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        fileNameLabel.textContent = this.files[0].name;
      } else {
        fileNameLabel.textContent = 'No file chosen';
      }
    });

    // Feature 2: Character counter for the textarea
    const aboutTextArea = document.getElementById('aboutUser');
    const charCountDisplay = document.getElementById('charCount');

    aboutTextArea.addEventListener('input', function() {
      charCountDisplay.textContent = this.value.length;
    });
  </script>

</body>
</html>
