<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #eceef4;
    color: #1f2430;
  }

  /* Header */
  .header {
    background: linear-gradient(90deg, #3b5bfd 0%, #7c5cff 100%);
    padding: 28px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .header .icon-circle {
    width: 56px;
    height: 56px;
    border: 2px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .header .icon-circle svg { width: 28px; height: 28px; fill: #fff; }
  .header h1 {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
  }
  .header p {
    color: #e6e8ff;
    font-size: 14px;
    margin-top: 2px;
  }

  /* Main container */
  .container {
    max-width: 1050px;
    margin: 30px auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    padding: 32px 36px 28px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-title .badge {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .section-title .badge svg { width: 16px; height: 16px; fill: #fff; }
  .section-title h2 {
    font-size: 17px;
    font-weight: 700;
  }
  .badge.blue { background: #3b5bfd; }
  .section-title.blue h2 { color: #3b5bfd; }
  .badge.green { background: #16a34a; }
  .section-title.green h2 { color: #16a34a; }
  .badge.purple { background: #7c3aed; }
  .section-title.purple h2 { color: #7c3aed; }

  hr.divider {
    border: none;
    border-top: 1px solid #e2e5ec;
    margin-bottom: 22px;
  }
  hr.divider.green { border-top-color: #bbf0cc; }
  hr.divider.purple { border-top-color: #ddd0fb; }

  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 20px;
  }
  .row.two-col { grid-template-columns: repeat(2, 1fr); }
  .row.three-col-notes { grid-template-columns: 1.6fr 1.6fr 1fr; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #2b2f3a;
    margin-bottom: 6px;
  }
  .field label .req { color: #e11d48; margin-left: 2px; }

  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="password"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 9px 12px;
    font-size: 13.5px;
    border: 1px solid #d7dae3;
    border-radius: 6px;
    color: #333;
    background: #fff;
    outline: none;
    font-family: inherit;
  }
  input::placeholder, textarea::placeholder { color: #9aa0ac; }
  input:focus, select:focus, textarea:focus {
    border-color: #7c8cfb;
    box-shadow: 0 0 0 3px rgba(59,91,253,0.12);
  }

  .radio-group {
    display: flex;
    align-items: center;
    gap: 22px;
    height: 37px;
  }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 400;
    color: #333;
    margin: 0;
    cursor: pointer;
  }
  .radio-group input[type="radio"] { width: 15px; height: 15px; accent-color: #3b5bfd; }

  .file-input-wrap {
    display: flex;
    align-items: center;
    border: 1px solid #d7dae3;
    border-radius: 6px;
    overflow: hidden;
    font-size: 13px;
  }
  .file-input-wrap .choose-btn {
    background: #e9ebf0;
    padding: 8px 14px;
    border-right: 1px solid #d7dae3;
    color: #333;
    white-space: nowrap;
    cursor: pointer;
  }
  .file-input-wrap .file-name {
    padding: 8px 12px;
    color: #9aa0ac;
    flex: 1;
  }
  .file-input-wrap input[type="file"] { display: none; }

  textarea { resize: vertical; min-height: 100px; }
  .char-count {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: #9aa0ac;
    margin-top: 4px;
  }

  select[multiple] {
    height: 110px;
    padding: 6px 0;
  }
  select[multiple] option {
    padding: 4px 12px;
  }

  .agree-box {
    background: #f3f6ff;
    border: 1px solid #dbe2fb;
    border-radius: 8px;
    padding: 18px 22px;
    margin-top: 6px;
  }
  .agree-box .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .agree-box .checkbox-row input { width: 15px; height: 15px; }
  .agree-box .checkbox-row a { color: #3b5bfd; text-decoration: none; }
  .agree-box .checkbox-row a:hover { text-decoration: underline; }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .btn svg { width: 14px; height: 14px; fill: #fff; }
  .btn.submit { background: #3b5bfd; color: #fff; }
  .btn.submit:hover { background: #2f4be0; }
  .btn.reset { background: #6b7280; color: #fff; }
  .btn.reset:hover { background: #59616e; }

  footer {
    text-align: center;
    padding: 18px;
    font-size: 12.5px;
    color: #6b7280;
  }

  @media (max-width: 900px) {
    .row { grid-template-columns: repeat(2, 1fr); }
    .row.three-col-notes { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .row, .row.two-col { grid-template-columns: 1fr; }
    .container { padding: 24px 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="icon-circle">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
  </div>
  <div>
    <h1>User Registration Form</h1>
    <p>Simple HTML &amp; CSS Form using div elements</p>
  </div>
</div>

<form class="container" id="regForm">

  <!-- Personal Information -->
  <div class="section-title blue">
    <div class="badge blue">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
    </div>
    <h2>Personal Information</h2>
  </div>
  <hr class="divider">

  <div class="row">
    <div class="field">
      <label>Full Name<span class="req">*</span></label>
      <input type="text" placeholder="Enter full name" required>
    </div>
    <div class="field">
      <label>Email Address<span class="req">*</span></label>
      <input type="email" placeholder="Enter email address" required>
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" placeholder="Enter phone number">
    </div>
    <div class="field">
      <label>Date of Birth</label>
      <input type="date" placeholder="dd-mm-yyyy">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender"> Male</label>
        <label><input type="radio" name="gender"> Female</label>
        <label><input type="radio" name="gender"> Other</label>
      </div>
    </div>
    <div class="field">
      <label>Password<span class="req">*</span></label>
      <input type="password" placeholder="Enter password" required>
    </div>
    <div class="field">
      <label>Confirm Password<span class="req">*</span></label>
      <input type="password" placeholder="Confirm password" required>
    </div>
    <div class="field">
      <label>Profile Picture</label>
      <div class="file-input-wrap">
        <label class="choose-btn" for="profilePic">Choose File</label>
        <span class="file-name" id="fileNameLabel">No file chosen</span>
        <input type="file" id="profilePic">
      </div>
    </div>
  </div>

  <!-- Address Information -->
  <div class="section-title green">
    <div class="badge green">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    </div>
    <h2>Address Information</h2>
  </div>
  <hr class="divider green">

  <div class="row">
    <div class="field">
      <label>Address Line 1</label>
      <input type="text" placeholder="House no., Street name">
    </div>
    <div class="field">
      <label>Address Line 2</label>
      <input type="text" placeholder="Apartment, suite, unit etc. (optional)">
    </div>
    <div class="field">
      <label>City</label>
      <input type="text" placeholder="Enter city">
    </div>
    <div class="field">
      <label>State</label>
      <select>
        <option>Select State</option>
        <option>Gujarat</option>
        <option>Maharashtra</option>
        <option>Delhi</option>
        <option>Karnataka</option>
        <option>Rajasthan</option>
      </select>
    </div>
  </div>

  <div class="row two-col">
    <div class="field">
      <label>Country</label>
      <select>
        <option>Select Country</option>
        <option>India</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Canada</option>
        <option>Australia</option>
      </select>
    </div>
    <div class="field">
      <label>Pin / Zip Code</label>
      <input type="text" placeholder="Enter pin or zip code">
    </div>
  </div>

  <!-- Additional Information -->
  <div class="section-title purple">
    <div class="badge purple">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 5h6v2H9V5zm10 14H5V8h14v11z"/></svg>
    </div>
    <h2>Additional Information</h2>
  </div>
  <hr class="divider purple">

  <div class="row three-col-notes">
    <div class="field">
      <label>About You</label>
      <textarea maxlength="200" placeholder="Write something about yourself..." oninput="document.getElementById('charCount').textContent = this.value.length"></textarea>
      <div class="char-count">
        <span>Maximum 200 characters</span>
        <span><span id="charCount">0</span>/200</span>
      </div>
    </div>
    <div class="field">
      <label>Skills</label>
      <select multiple>
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>Java</option>
        <option>Python</option>
        <option>React</option>
        <option>Node.js</option>
      </select>
    </div>
    <div class="field">
      <label>Experience Level</label>
      <select style="margin-bottom: 20px;">
        <option>Select Experience Level</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
        <option>Expert</option>
      </select>
      <label>Preferred Contact Time</label>
      <select>
        <option>Select Time</option>
        <option>Morning</option>
        <option>Afternoon</option>
        <option>Evening</option>
      </select>
    </div>
  </div>

  <div class="agree-box">
    <div class="checkbox-row">
      <input type="checkbox" id="agree">
      <label for="agree">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>.</label>
    </div>
    <div class="btn-row">
      <button type="submit" class="btn submit">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        Submit Form
      </button>
      <button type="reset" class="btn reset">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Reset Form
      </button>
    </div>
  </div>

</form>

<footer>© 2024 My Website. All rights reserved.</footer>

<script>
  document.getElementById('profilePic').addEventListener('change', function() {
    const label = document.getElementById('fileNameLabel');
    label.textContent = this.files.length ? this.files[0].name : 'No file chosen';
  });
</script>

</body>
</html>
