<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            border: 2px solid black;
        }
        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td rowspan="2"><b>Table</b></td>
            <td colspan="3" style="text-align: center;"><b>Title</b></td>
        </tr>
        <tr>
            <td><b>Head 1</b></td>
            <td><b>Head 2</b></td>
            <td><b>Head 3</b></td>
        </tr>
        <tr>
            <td>Row 1</td>
            <td>Data 1</td>
            <td>Data 2</td>
            <td>Data 3 </td>
        </tr>
        <tr>
            <td>Row 2</td>
            <td>Data 4</td>
            <td>Data 5</td>
            <td>Data 6</td>
        </tr>
    </table>
</body>
</html>
