<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Signup Form</title>
  <link rel="stylesheet" href="bootstrap-5.3.8/dist/css/bootstrap.min.css">

  <!-- <script src="regJavaScript.js"></script> -->

  <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="regJquery.js"></script> -->

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>

  <script src="regPlugin.js"></script>
</head>

<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h3 class="text-center mb-4">Signup Form</h3>
            <form id="signupForm" name="signupForm" action="javascript:void(0);"> <!-- Name -->
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name">
                <span id="nameError" class="text-danger"></span>
              </div>

              <!-- Gender -->
              <div class="mb-3">
                <label class="form-label">Gender</label><br>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" id="genderMale" name="gender" value="Male">
                  <label class="form-check-label" for="genderMale">Male</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" id="genderFemale" name="gender" value="Female">
                  <label class="form-check-label" for="genderFemale">Female</label>
                </div>
                <span id="genderError" class="text-danger"></span>
              </div>

              <!-- DOB -->
              <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="form-control">
                <span id="dobError" class="text-danger"></span>
              </div>

              <script>
                const today = new Date().toISOString().split("T")[0];
                document.getElementById("dob").setAttribute("max", today);
              </script>

              <!-- Country -->
              <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <select id="country" name="country" class="form-select">
                  <option selected>--Select Country--</option>
                  <option value="India">India</option>
                  <option value="USA">USA</option>
                  <option value="UK">UK</option>
                </select>
                <span id="countryError" class="text-danger"></span>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                  placeholder="Enter your password">
                <span id="passwordError" class="text-danger"></span>
              </div>

              <!-- Confirm Password -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                  placeholder="Confirm your password">
                <span id="confirmPasswordError" class="text-danger"></span>
              </div>

              <!-- Terms -->
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms" name="terms">
                <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
                <span id="termsError" class="text-danger"></span>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100">Submit</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>


</body>

</html>
