<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Login</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginForm" method="get">
                            <div class="mb-3">
                                <label for="username" class="form-label"> Username </label>
                                <input type="text" id="Username" name="username" class="form-control"
                                    placeholder="Enter username">

                                <div id="usernameError" class="text-danger mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control"
                                    placeholder="Enter password">

                                <div id="passwordError" class="text-danger mt-1"></div>
                            </div>
                            <button type="submit" onclick="validateForm()" class="btn btn-primary w-100">

                                Login </button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function validateForm() {
            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value;
            let usernameError = document.getElementById("usernameError");
            let passwordError = document.getElementById("passwordError");

            usernameError.innerHTML = "";
            passwordError.innerHTML = "";

            let isValid = true;

            if (username === "") {
                usernameError.innerHTML = "Username is required";
                isValid = false;
            } else if (username.length < 3) {
                usernameError.innerHTML = "Username must be at least 3 characters";
                isValid = false;
            }

            if (password === "") {
                passwordError.innerHTML = "Password is required";
                isValid = false;
            } else if (password.length < 8) {
                passwordError.innerHTML = "Password must be at least 8 characters";
                isValid = false;
            }

            return isValid;
        }

    </script>
</body>

</html>
