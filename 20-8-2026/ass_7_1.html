<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <!-- Load jQuery from CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function(){
      $("button").click(function(){
        $("#div1").load("ass_7_1.txt", function(response, status, xhr){
          if(status == "error"){
            $("#div1").html("Error: " + xhr.status + " " + xhr.statusText);
          }
        });
      });
    });
  </script>
</head>
<body>
  <div id="div1">
    Let jQuery AJAX change this
  </div>
  <button>Get File Text</button>
</body>
</html>
